<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reflex Pulse: Neon Cyber Edition</title>
  <style>
    :root {
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff0055;
      --neon-gold: #ffaa00;
      --neon-green: #00ff66;
      --neon-purple: #9d00ff;
      --bg-dark: #05050d;
      --panel-bg: rgba(13, 14, 33, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg-dark);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-wrapper {
      position: relative;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: var(--panel-bg);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-label {
      font-size: 0.75rem;
      color: #8a99ad;
      text-transform: uppercase;
    }

    .hud-value {
      font-size: 1.4rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px var(--neon-cyan);
    }

    canvas {
      background: #020208;
      display: block;
      width: 100%;
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 0 0 12px 12px;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
      cursor: crosshair;
    }

    .overlay {
      position: absolute;
      top: 50px;
      left: 0;
      width: 100%;
      height: calc(100% - 50px);
      background: rgba(5, 5, 13, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 0 0 12px 12px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: 3rem;
      color: var(--neon-cyan);
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-magenta);
      margin-bottom: 10px;
      text-align: center;
    }

    p.subtitle {
      color: #a0aec0;
      margin-bottom: 25px;
      font-size: 1.1rem;
      text-align: center;
    }

    .btn {
      padding: 14px 32px;
      background: transparent;
      color: var(--neon-cyan);
      border: 2px solid var(--neon-cyan);
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
      transition: all 0.2s ease;
      margin: 10px;
    }

    .btn:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 25px var(--neon-cyan);
      transform: translateY(-2px);
    }

    .leaderboard {
      margin-top: 20px;
      width: 80%;
      max-width: 400px;
      background: rgba(13, 14, 33, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 15px;
    }

    .leaderboard h3 {
      color: var(--neon-gold);
      text-align: center;
      margin-bottom: 10px;
      text-transform: uppercase;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
    }

    .score-row:last-child {
      border-bottom: none;
    }

    .score-rank {
      color: #8a99ad;
    }

    .score-val {
      color: var(--neon-green);
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="game-wrapper">
  <div class="hud">
    <div class="hud-item">
      <span class="hud-label">Score</span>
      <span class="hud-value" id="hud-score">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Multiplier</span>
      <span class="hud-value" id="hud-combo">x1</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Lives</span>
      <span class="hud-value" id="hud-lives">3</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">High Score</span>
      <span class="hud-value" id="hud-highscore">0</span>
    </div>
  </div>

  <canvas id="gameCanvas" width="900" height="550"></canvas>

  <!-- Start Menu -->
  <div id="start-menu" class="overlay">
    <h1>Reflex Pulse</h1>
    <p class="subtitle">Cybernetic Precision & Reaction Speed Test</p>
    <button class="btn" onclick="initGame()">Start Arcade Run</button>
    
    <div class="leaderboard">
      <h3>Top High Scores</h3>
      <div id="leaderboard-list"></div>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameover-menu" class="overlay hidden">
    <h1 style="color: var(--neon-magenta); text-shadow: 0 0 20px var(--neon-magenta);">System Failure</h1>
    <p class="subtitle" id="final-score-text">Final Score: 0</p>
    <button class="btn" onclick="initGame()">Reboot Engine</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Web Audio Synth Engine
  let audioCtx = null;

  function playSound(type) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'hit') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'powerup') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now + 0.25);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'miss') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.2);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    }
  }

  // Game Engine State
  let score = 0;
  let combo = 1;
  let lives = 3;
  let highScores = JSON.parse(localStorage.getItem('reflex_pulse_scores')) || [0, 0, 0];
  let targets = [];
  let particles = [];
  let floatingTexts = [];
  let isRunning = false;
  let spawnTimer = 0;
  let spawnInterval = 70; // frame count
  let frameCount = 0;

  // DOM Elements
  const hudScore = document.getElementById('hud-score');
  const hudCombo = document.getElementById('hud-combo');
  const hudLives = document.getElementById('hud-lives');
  const hudHighScore = document.getElementById('hud-highscore');
  const startMenu = document.getElementById('start-menu');
  const gameOverMenu = document.getElementById('gameover-menu');
  const finalScoreText = document.getElementById('final-score-text');
  const leaderboardList = document.getElementById('leaderboard-list');

  function updateLeaderboardUI() {
    hudHighScore.innerText = highScores[0] || 0;
    leaderboardList.innerHTML = highScores.map((sc, i) => `
      <div class="score-row">
        <span class="score-rank">#${i + 1}</span>
        <span class="score-val">${sc} PTS</span>
      </div>
    `).join('');
  }

  function saveHighScore(newScore) {
    highScores.push(newScore);
    highScores.sort((a, b) => b - a);
    highScores = highScores.slice(0, 3);
    localStorage.setItem('reflex_pulse_scores', JSON.stringify(highScores));
    updateLeaderboardUI();
  }

  class Target {
    constructor() {
      this.radius = Math.random() * 18 + 18;
      this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
      this.y = Math.random() * (canvas.height - this.radius * 2) + this.radius;
      this.maxAlpha = 1;
      this.alpha = 1;
      this.shrinkRate = 0.008 + Math.random() * 0.006 + (score / 10000) * 0.002;
      
      // Power-up chance (15%)
      this.isPowerUp = Math.random() < 0.15;
      this.color = this.isPowerUp ? '#ffaa00' : '#00f3ff';
    }

    draw() {
      ctx.save();
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.alpha * 0.25;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 3;
      ctx.globalAlpha = this.alpha;
      ctx.shadowBlur = 12;
      ctx.shadowColor = this.color;
      ctx.stroke();
      ctx.restore();
    }

    update() {
      this.alpha -= this.shrinkRate;
      return this.alpha > 0;
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      this.vx = (Math.random() - 0.5) * 8;
      this.vy = (Math.random() - 0.5) * 8;
      this.life = 1;
      this.decay = 0.03 + Math.random() * 0.02;
    }

    draw() {
      ctx.save();
      ctx.beginPath();
      ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.life;
      ctx.shadowBlur = 8;
      ctx.shadowColor = this.color;
      ctx.fill();
      ctx.restore();
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life -= this.decay;
      return this.life > 0;
    }
  }

  class FloatingText {
    constructor(x, y, text, color) {
      this.x = x;
      this.y = y;
      this.text = text;
      this.color = color;
      this.life = 1;
    }

    draw() {
      ctx.save();
      ctx.font = 'bold 16px "Segoe UI", sans-serif';
      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.life;
      ctx.shadowBlur = 8;
      ctx.shadowColor = this.color;
      ctx.fillText(this.text, this.x - 15, this.y);
      ctx.restore();
    }

    update() {
      this.y -= 1.2;
      this.life -= 0.025;
      return this.life > 0;
    }
  }

  function createExplosion(x, y, color) {
    for (let i = 0; i < 16; i++) {
      particles.push(new Particle(x, y, color));
    }
  }

  function gameLoop() {
    if (!isRunning) return;

    frameCount++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Dynamic Spawning
    spawnTimer++;
    if (spawnTimer >= Math.max(25, spawnInterval - Math.floor(score / 800))) {
      targets.push(new Target());
      spawnTimer = 0;
    }

    // Targets Loop
    for (let i = targets.length - 1; i >= 0; i--) {
      let t = targets[i];
      if (!t.update()) {
        // Target Expired / Missed
        targets.splice(i, 1);
        combo = 1;
        lives--;
        playSound('miss');
        floatingTexts.push(new FloatingText(t.x, t.y, 'MISS', '#ff0055'));
        
        hudCombo.innerText = `x${combo}`;
        hudLives.innerText = lives;

        if (lives <= 0) {
          endGame();
          return;
        }
      } else {
        t.draw();
      }
    }

    // Particles Loop
    particles = particles.filter(p => {
      p.draw();
      return p.update();
    });

    // Floating Text Loop
    floatingTexts = floatingTexts.filter(ft => {
      ft.draw();
      return ft.update();
    });

    requestAnimationFrame(gameLoop);
  }

  canvas.addEventListener('mousedown', (e) => {
    if (!isRunning) return;

    const rect = canvas.getBoundingClientRect();
    const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
    const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

    let hit = false;
    for (let i = targets.length - 1; i >= 0; i--) {
      let t = targets[i];
      let dist = Math.hypot(clickX - t.x, clickY - t.y);

      if (dist <= t.radius) {
        hit = true;
        createExplosion(t.x, t.y, t.color);

        if (t.isPowerUp) {
          score += 300 * combo;
          lives = Math.min(5, lives + 1);
          playSound('powerup');
          floatingTexts.push(new FloatingText(t.x, t.y, `+300 & +1 LIFE!`, '#ffaa00'));
        } else {
          score += 100 * combo;
          combo++;
          playSound('hit');
          floatingTexts.push(new FloatingText(t.x, t.y, `+${100 * combo}`, '#00f3ff'));
        }

        hudScore.innerText = score;
        hudCombo.innerText = `x${combo}`;
        hudLives.innerText = lives;

        targets.splice(i, 1);
        break;
      }
    }
  });

  function initGame() {
    score = 0;
    combo = 1;
    lives = 3;
    targets = [];
    particles = [];
    floatingTexts = [];
    spawnTimer = 0;
    isRunning = true;

    hudScore.innerText = score;
    hudCombo.innerText = `x${combo}`;
    hudLives.innerText = lives;

    startMenu.classList.add('hidden');
    gameOverMenu.classList.add('hidden');

    requestAnimationFrame(gameLoop);
  }

  function endGame() {
    isRunning = false;
    saveHighScore(score);
    finalScoreText.innerText = `Final Score: ${score} PTS`;
    gameOverMenu.classList.remove('hidden');
  }

  // Initial setup
  updateLeaderboardUI();
</script>

</body>
</html>
